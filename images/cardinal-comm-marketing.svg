<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <!-- ==================== DESIGN SYSTEM & DEFINITIONS ==================== -->
  <defs>
    <!-- Background: Sleek Corporate Blueprint / Tech Grid Feel -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Column Lane Background Gradients -->
    <linearGradient id="lane-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2541" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3a506b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Cards -->
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <dropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Logo Glow Effect -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <blur stdDeviation="2" result="blur"/>
      <composite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap');

    /* Typography */
    .brand-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; fill: #64ffda; letter-spacing: 5px; text-transform: uppercase; }
    .main-heading { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 38px; fill: #ffffff; letter-spacing: 1px; }
    .sub-heading { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #8892b0; letter-spacing: 0.5px; }
    
    .lane-header { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; fill: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
    .speaker-box-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; fill: #ffffff; }
    .speaker-box-tag { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #64ffda; font-style: italic; }
    .speaker-box-topic { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; fill: #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px; }
    .speaker-box-text { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12.5px; fill: #94a3b8; }
    .speaker-box-meta { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; fill: #38bdf8; letter-spacing: 0.5px; }
    
    /* Layout Elements */
    .lane-rect { fill: url(#lane-grad); stroke: #233554; stroke-width: 1; rx: 8; }
    .card-rect { fill: #0b132b; stroke: #3a506b; stroke-width: 1; rx: 6; filter: url(#shadow-sm); }
    .badge-teal { fill: #64ffda; }
    .badge-blue { fill: #38bdf8; }
    .badge-purple { fill: #9b5de5; }
    .grid-line { stroke: #233554; stroke-width: 1; stroke-opacity: 0.4; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  
  <!-- Subtle Architectural Grid Background Lines -->
  <line x1="100" y1="0" x2="100" y2="1200" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="1200" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="1200" class="grid-line" />
  <line x1="1500" y1="0" x2="1500" y2="1200" class="grid-line" />

  <!-- ==================== HEADER ZONE (KANBAN TABS STYLE) ==================== -->
  <g transform="translate(80, 65)">
    <text x="0" y="0" class="brand-title">Cardinal Comm</text>
    <text x="0" y="42" class="main-heading">Expert Speaker Tracks</text>
    <text x="0" y="65" class="sub-heading">Select and filter organizational matches across key corporate delivery vectors.</text>
    
    <!-- Decorative Tech Accents -->
    <rect x="1390" y="20" width="50" height="4" fill="#64ffda" />
    <rect x="1415" y="30" width="25" height="4" fill="#38bdf8" />
  </g>

  <!-- ==================== COLUMN 1: PHILOSOPHY & MINDSET ==================== -->
  <g transform="translate(80, 190)">
    <!-- Lane Bracket -->
    <rect width="450" height="910" class="lane-rect" />
    <rect width="450" height="35" fill="#233554" rx="4" />
    <circle cx="25" cy="17" r="5" class="badge-teal" />
    <text x="42" y="22" class="lane-header">Mindset &amp; Philosophy (1)</text>

    <!-- Rafi Islam Card -->
    <g transform="translate(20, 60)">
      <rect width="410" height="250" class="card-rect" style="stroke: #64ffda;" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Rafi Islam</text>
        <text x="0" y="22" class="speaker-box-tag">Mindset, Habits, and Responses</text>
        
        <text x="0" y="65" class="speaker-box-topic">Stoicism: Ancient Wisdom</text>
        <text x="0" y="85" class="speaker-box-text">Using timeless principles to cultivate resilience,</text>
        <text x="0" y="105" class="speaker-box-text">improve operational choices, and establish focus</text>
        <text x="0" y="125" class="speaker-box-text">in volatile business spaces.</text>
        
        <text x="0" y="170" class="speaker-box-text" fill="#64748b">Best for: New Entrepreneurs, University Students</text>
        <text x="0" y="200" class="speaker-box-meta">📍 NORTH AMERICA ONLY • FEE: $3,000</text>
      </g>
    </g>

    <!-- NEW CONTENT: STYLISTIC LOGO DIRECTLY UNDERNEATH RAFI ISLAM -->
    <g transform="translate(20, 330)">
      <!-- Graphic Frame Border for the Branding Block -->
      <rect width="410" height="490" fill="#0b132b" stroke="#1c2541" stroke-dasharray="4 4" stroke-width="1.5" rx="6" />
      
      <!-- Logo Mark Group -->
      <g transform="translate(205, 210)" text-anchor="middle">
        <!-- Abstract Interlocking Geometric Logo Background Elements -->
        <path d="M-45,-45 L45,-45 L25,-15 L-25,-15 Z" fill="#64ffda" fill-opacity="0.05" />
        <path d="M-25,15 L25,15 L45,45 L-45,45 Z" fill="#38bdf8" fill-opacity="0.05" />
        
        <!-- Stylized "CC" Monogram Shield -->
        <path d="M-30,-30 C-60,0 -60,40 -30,70 L-10,50 C-25,30 -25,10 -10,-10 Z" fill="#64ffda" filter="url(#logo-glow)"/>
        <path d="M30,30 C60,0 60,-40 30,-70 L10,-50 C25,-30 25,-10 10,10 Z" fill="#38bdf8" filter="url(#logo-glow)"/>
        
        <!-- Typography Core Logo Wordmark -->
        <text x="0" y="120" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28px" fill="#ffffff" letter-spacing="4px">CARDINAL</text>
        <text x="0" y="155" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="22px" fill="#64ffda" letter-spacing="9px">COMM</text>
        
        <!-- Tech Accent Sub-Lines -->
        <line x1="-60" y1="185" x2="60" y2="185" stroke="#233554" stroke-width="2" />
        <circle cx="0" cy="185" r="3" fill="#38bdf8" />
        
        <text x="0" y="215" font-family="'Inter', sans-serif" font-weight="500" font-size="10px" fill="#8892b0" letter-spacing="3px" text-transform="uppercase">BUREAU NETWORK</text>
      </g>
    </g>

    <!-- Explanatory Lane Footer Memo -->
    <g transform="translate(25, 850)">
      <text x="0" y="0" font-family="'Inter'" font-size="11px" fill="#64748b" text-transform="uppercase" letter-spacing="1px">Track Orientation</text>
      <text x="0" y="18" font-family="'Inter'" font-size="12px" fill="#8892b0">Delivers baseline emotional architecture and perspective anchors.</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: TECH, AI & REINVENTION ==================== -->
  <g transform="translate(575, 190)">
    <!-- Lane Bracket -->
    <rect width="450" height="910" class="lane-rect" />
    <rect width="450" height="35" fill="#233554" rx="4" />
    <circle cx="25" cy="17" r="5" class="badge-blue" />
    <text x="42" y="22" class="lane-header">Technology &amp; AI Data (3)</text>

    <!-- Spoorthi Gunuganti Card -->
    <g transform="translate(20, 60)">
      <rect width="410" height="240" class="card-rect" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Spoorthi Gunuganti</text>
        <text x="0" y="22" class="speaker-box-tag">Data Stories &amp; Responsible Innovation</text>
        
        <text x="0" y="62" class="speaker-box-topic">The Secret Life of Data</text>
        <text x="0" y="82" class="speaker-box-text">How online actions fuel AI structures, and how</text>
        <text x="0" y="102" class="speaker-box-text">to keep human metrics centered in automation.</text>
        
        <text x="0" y="142" class="speaker-box-text" fill="#64748b">Best for: Tech Professionals, Corporate Teams</text>
        <text x="0" y="188" class="speaker-box-meta">🌐 VIRTUAL &amp; WORLDWIDE IN-PERSON • FROM $1,000</text>
      </g>
    </g>

    <!-- Preetham Sai Peddiraju Card -->
    <g transform="translate(20, 320)">
      <rect width="410" height="240" class="card-rect" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Preetham Sai Peddiraju</text>
        <text x="0" y="22" class="speaker-box-tag">Engineering, AI, &amp; Human Curiosity</text>
        
        <text x="0" y="62" class="speaker-box-topic">Start Before You're Ready</text>
        <text x="0" y="82" class="speaker-box-text">Navigating unexpected transitions, leveraging</text>
        <text x="0" y="102" class="speaker-box-text">storytelling, and navigating complex tech shifts.</text>
        
        <text x="0" y="142" class="speaker-box-text" fill="#64748b">Best for: Career Changers, STEM Student Centers</text>
        <text x="0" y="188" class="speaker-box-meta">🌍 GLOBAL TRANSIT FLUIDITY • KEYNOTE FROM $3,500</text>
      </g>
    </g>

    <!-- Vivek Mamidala Card -->
    <g transform="translate(20, 580)">
      <rect width="410" height="240" class="card-rect" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Vivek Mamidala</text>
        <text x="0" y="22" class="speaker-box-tag">Backend Infrastructure Optimization</text>
        
        <text x="0" y="62" class="speaker-box-topic">Beyond the Comfort Zone</text>
        <text x="0" y="82" class="speaker-box-text">Tracing architectural logic in cloud networks,</text>
        <text x="0" y="102" class="speaker-box-text">fitness systems, and global cultural scaling.</text>
        
        <text x="0" y="142" class="speaker-box-text" fill="#64748b">Best for: Software Engineers, Technical Frameworks</text>
        <text x="0" y="188" class="speaker-box-meta">🚘 IN-PERSON NA: $1,000 | 💻 VIRTUAL AVAILABLE</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 3: DISCIPLINE & LEADERSHIP ==================== -->
  <g transform="translate(1070, 190)">
    <!-- Lane Bracket -->
    <rect width="450" height="910" class="lane-rect" />
    <rect width="450" height="35" fill="#233554" rx="4" />
    <circle cx="25" cy="17" r="5" class="badge-purple" />
    <text x="42" y="22" class="lane-header">Discipline &amp; Impact (3)</text>

    <!-- Amit Singh Card -->
    <g transform="translate(20, 60)">
      <rect width="410" height="240" class="card-rect" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Amit Singh</text>
        <text x="0" y="22" class="speaker-box-tag">Execution Habits &amp; Team Management</text>
        
        <text x="0" y="62" class="speaker-box-topic">Show Up Anyway: Consistent Reps</text>
        <text x="0" y="82" class="speaker-box-text">Ditching reliance on motivation to build robust</text>
        <text x="0" y="102" class="speaker-box-text">systems across demanding operational workloads.</text>
        
        <text x="0" y="142" class="speaker-box-text" fill="#64748b">Best for: Young Professionals, Academic Circuits</text>
        <text x="0" y="188" class="speaker-box-meta">💻 REMOTE VIRTUAL CHANNELS ONLY • FROM $500</text>
      </g>
    </g>

    <!-- Paula Ramirez Orozco Card -->
    <g transform="translate(20, 320)">
      <rect width="410" height="240" class="card-rect" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Paula Ramirez Orozco</text>
        <text x="0" y="22" class="speaker-box-tag">Intercultural Community Collaboration</text>
        
        <text x="0" y="62" class="speaker-box-topic">Bridging Cultures &amp; Tech Systems</text>
        <text x="0" y="82" class="speaker-box-text">Using Nonviolent Communication (NVC) metrics</text>
        <text x="0" y="102" class="speaker-box-text">and data cleaning to unify civic goals.</text>
        
        <text x="0" y="142" class="speaker-box-text" fill="#64748b">Best for: Public Sector, Civic Nonprofits</text>
        <text x="0" y="188" class="speaker-box-meta">🤝 VOLUNTEER BASIS • TRAVEL EXPENSES TO BE COVERED</text>
      </g>
    </g>

    <!-- Sadat Card -->
    <g transform="translate(20, 580)">
      <rect width="410" height="240" class="card-rect" />
      <g transform="translate(25, 35)">
        <text x="0" y="0" class="speaker-box-name">Sadat</text>
        <text x="0" y="22" class="speaker-box-tag">Adversity Mastery &amp; Emotional Intelligence</text>
        
        <text x="0" y="62" class="speaker-box-topic">The TABLE Framework Strategy</text>
        <text x="0" y="82" class="speaker-box-text">Applying Truth, Accountability, and Balance</text>
        <text x="0" y="102" class="speaker-box-text">to transform roadblocks into internal growth.</text>
        
        <text x="0" y="142" class="speaker-box-text" fill="#64748b">Best for: Enterprise Leads, Executive Units</text>
        <text x="0" y="188" class="speaker-box-meta">💼 COMPLIMENTARY FOR REGISTERED NONPROFITS</text>
      </g>
    </g>
  </g>
  
  <!-- ==================== LOGISTICAL SYSTEM BAR FOOTER ==================== -->
  <g transform="translate(80, 1145)">
    <rect x="-80" y="0" width="1600" height="55" fill="#0c1325" />
    <text x="0" y="32" font-family="'Space Grotesk'" font-weight="700" fill="#8892b0" font-size="12px" letter-spacing="2px">CARDINAL COMM AGENCY ENGINE • PROJECT COORDINATION 2026</text>
    <text x="1440" y="32" font-family="'Space Grotesk'" font-weight="700" fill="#64ffda" font-size="12px" letter-spacing="1px" text-anchor="end">BOOKING PIPELINE OPEN</text>
  </g>
</svg>
